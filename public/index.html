<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Use Arcanju</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f2e8d9;color:#704b4b;font:16px system-ui;padding:24px}main{width:min(420px,100%);padding:40px;background:#fffaf4;border:1px solid #704b4b22;border-radius:24px;box-shadow:0 24px 80px #704b4b16}small{letter-spacing:.15em}h1{font:36px Georgia;margin-bottom:8px}p{line-height:1.6}label{display:block;margin-top:30px}input,button{width:100%;font:inherit;border-radius:12px;padding:14px;margin-top:10px}input{border:1px solid #704b4b50}button{background:#704b4b;color:white;border:0;cursor:pointer}#error{color:#9d2828;min-height:24px}footer{font-size:12px;margin-top:24px;color:#7d716b}</style><main><small>USE ARCANJU · GESTÃO</small><h1>Bem-vindo, Mateus.</h1><p>Seu financeiro, suas metas e a próxima decisão.</p><form id="login"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="off" required maxlength="256" autofocus><button id="submit">Entrar no financeiro</button><p id="error" role="alert"></p></form><footer>A senha é solicitada a cada abertura ou recarregamento. Sessão bloqueada após 15 minutos sem interação.</footer></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let b=document.querySelector('#submit'),p=document.querySelector('#password');b.disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value}),cache:'no-store'});p.value='';let data=await r.json();if(!r.ok)throw Error(data.error||'Não foi possível entrar.');window.__ARCANJU_TOKEN=data.token;let page=await fetch('/api/app',{headers:{Authorization:'Bearer '+data.token},cache:'no-store'});if(!page.ok)throw Error('Não foi possível abrir o app.');let html=await page.text();document.open();document.write(html);document.close()}catch(err){document.querySelector('#error').textContent=err.message;b.disabled=false}};</script></html>
